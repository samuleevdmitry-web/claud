# Ключи для Вордстата: брендовый и рыночный спрос B2B-направлений Олдос (ткани, ПВХ, фурнитура).
#
# Как читать фразу: Вордстат считает все запросы, где есть эти слова в любой форме и порядке.
# «-слово» исключает запросы с ним: так из спроса убраны детская одежда, сканворды, обои, стирка и т. п.
# Оператор «или» API не поддерживает, поэтому у категории может быть несколько фраз — они суммируются.
# Фразы проверены 12.11.2026: число в комментарии — запросов за 30 дней по всем регионам.
# Категории без отдельного устойчивого запроса (меньше ~100 в месяц или нет однозначной формулировки)
# перечислены в конце файла и не собираются.

# Регион Вордстата для каждого сайта: дашборд показывает спрос того рынка, чей сайт выбран.
[regions]
"oldos.ru" = { id = 225, name = "Россия" }
"oldos.kz" = { id = 159, name = "Казахстан" }

# Бренд, только B2B: ткани, ПВХ и фурнитура. Общие запросы («олдос», «олдос официальный сайт»)
# не входят: по ним не отличить ткани от детской одежды Олдос, а «олдос» без уточнения ещё и писатель Хаксли.
[brand]
phrases = [
    "олдос ткани",                # 829: «олдос ткани оптом», «… официальный сайт», города
    "олдос фурнитура -ткани",     # 19
    "олдос пвх -ткани",           # 16
    "oldos ткани",                # 75: в т. ч. «os oldos ткани и фурнитура»
    "oldos фурнитура -ткани",     # 26
]

# Рыночный спрос в целом, как на слайде «Спрос в сети» ежемесячного отчёта.
[market]
phrases = [
    "ткани оптом",                # 26 566
    "текстиль оптом",             # 4 042
    "швейная фурнитура оптом",    # 4 129
]

