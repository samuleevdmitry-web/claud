services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenders
      POSTGRES_USER: tenders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenders -d tenders"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tenders:${POSTGRES_PASSWORD:-tenders}@db:5432/tenders
    ports:
      # 127.0.0.1 — только этот компьютер; APP_BIND=0.0.0.0 в .env — доступ из локальной сети.
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS для размещения на сервере: docker compose --profile https up -d (см. docs/deploy.md).
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
